# PFF full stack: TimescaleDB + Go API (ms) + web client (nginx serving the SPA
# and proxying /api to ms). Optional profile "tls" adds Caddy for automatic HTTPS.
#
#   cp .env.example .env                                   # then edit it
#   cp config/allowed-emails.txt.example config/allowed-emails.txt
#   docker compose up -d --build                           # from this folder
#
# Local demo without Google/bank credentials: see docker-compose.dev.yml.
name: pff

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pff
      POSTGRES_USER: pff
      POSTGRES_PASSWORD: ${PFF_DB_PASSWORD:?set PFF_DB_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pff-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pff -d pff"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pff]

  ms:
    build:
      context: ../ms
      dockerfile: ../cluster/ms.Dockerfile
    image: pff/ms:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # the dev overlay uses .env.dev instead
    environment:
      PFF_DATABASE_URL: postgres://pff:${PFF_DB_PASSWORD}@db:5432/pff?sslmode=disable
      PFF_HTTP_ADDR: ":8080"
      PFF_ALLOWED_EMAILS_FILE: /etc/pff/allowed-emails.txt
      # Requests arrive through nginx (and Caddy) on this network; trust their
      # X-Forwarded-For so the bank sees the user's real IP (PSU-IP-Address).
      PFF_TRUSTED_PROXIES: 172.28.0.0/24
    volumes:
      - ./config:/etc/pff:ro
      - ./secrets:/run/pff-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/pff", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [pff]

  client:
    build:
      context: ../client
      dockerfile: ../cluster/client.Dockerfile
    image: pff/client:local
    restart: unless-stopped
    ports:
      - "${PFF_HTTP_BIND:-127.0.0.1}:${PFF_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ms:
        condition: service_healthy
    networks: [pff]

  # HTTPS termination with automatic Let's Encrypt certificates. Web push,
  # Firebase sign-in and the bank redirect all require HTTPS in production.
  #   docker compose --profile tls up -d
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      PFF_DOMAIN: ${PFF_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [client]
    networks: [pff]

networks:
  pff:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pff-db:
  caddy-data:
