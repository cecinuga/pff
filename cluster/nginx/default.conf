# Serves the SPA and proxies /api to the Go backend (same origin, no CORS).
#
# add_header directives are only inherited by locations that define none, so
# caching uses `expires` (which sets Cache-Control) and the security headers
# are declared once at server level.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Firebase Auth (Google popup, reCAPTCHA for SMS) and FCM need Google origins.
    # Bank logos come from the provider's CDN, hence https: in img-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://www.google.com; frame-src https://*.firebaseapp.com https://*.web.app https://www.google.com https://www.recaptcha.net https://accounts.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://ms:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # First syncs with a bank can take a while.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The service worker and the HTML shell must always be revalidated.
    location = /sw.js {
        expires epoch;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
